<!doctype html>
<html lang="zh-Hans"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="不用纠结，找到今天想吃的马来西亚美食。"><title>Makan · 今天吃什么</title><style>
*{box-sizing:border-box}body{margin:0;background:#faf8f2;color:#233c30;font-family:Inter,'Microsoft YaHei',sans-serif}button,select{font:inherit}button{cursor:pointer}header,main,footer{max-width:1160px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #d9dfd4}.logo{font-size:29px;font-weight:900;letter-spacing:-1.5px}.logo span{color:#f48049}nav{display:flex;gap:12px}button{border:1px solid #ccd5c9;border-radius:24px;padding:11px 20px;background:transparent;color:inherit}button:hover{background:#e8eddf}button:focus-visible,select:focus-visible{outline:3px solid #e9844c;outline-offset:3px}.primary{background:#284d3c;color:white;border:0}.primary:hover{background:#36684f}.hero{display:grid;grid-template-columns:1.15fr 1fr;gap:40px;align-items:center;padding:52px 0 38px}.eyebrow{font-size:12px;letter-spacing:3px;font-weight:700;color:#6d7e63}h1{font-size:clamp(44px,6vw,76px);line-height:1.18;letter-spacing:-3px;margin:20px 0}h1 em{font-style:normal;color:#dc7547}p{color:#768071;line-height:1.9}.hero-art{background:#e8ecd9;min-height:330px;border-radius:150px 150px 28px 28px;display:grid;place-content:center;position:relative;text-align:center}.bowl{font-size:140px;filter:drop-shadow(0 18px 15px #4a5a3825);transform:rotate(-10deg)}.sticker{position:absolute;right:-5px;top:25px;transform:rotate(12deg);background:#edb86a;border-radius:50%;padding:26px 15px;font-size:14px;font-weight:bold}.art-label{font-size:12px;letter-spacing:3px}.picker{padding:25px;background:white;border:1px solid #e1e5d9;border-radius:20px;display:flex;gap:18px;align-items:end;box-shadow:0 8px 30px #3e512008}.field{flex:1}label{display:block;font-size:12px;color:#798272;margin-bottom:10px}select{width:100%;border:0;background:#f4f5ef;border-radius:10px;padding:14px;color:#233c30}.picker button{padding:16px 28px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:38px 0 20px}h2{font-size:25px;letter-spacing:-1px;margin:0}.small{font-size:12px;color:#85907c}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{border:1px solid #e0e4d7;border-radius:18px;background:white;overflow:hidden}.food-art{height:170px;display:grid;place-content:center;font-size:85px;position:relative}.save{position:absolute;right:14px;top:14px;background:#ffffffc9;border:0;padding:7px 11px;font-size:21px}.card-body{padding:20px}.tags{font-size:11px;color:#7a866d;letter-spacing:1px}.card h3{margin:10px 0;font-size:21px}.card p{font-size:13px;margin:0 0 18px;min-height:48px}.card-bottom{display:flex;justify-content:space-between;align-items:center;font-size:13px}.price{font-weight:700}.pill{background:#f1f3e8;padding:6px 10px;border-radius:20px;color:#71805f;font-size:11px}footer{margin-top:35px;border-top:1px solid #dce1d4;display:flex;justify-content:space-between;font-size:12px;color:#7a866f}dialog{border:0;border-radius:24px;padding:32px;max-width:420px;width:90%;text-align:center;color:#233c30;background:#faf8f2}dialog::backdrop{background:#17352888}#resultEmoji{font-size:90px}#resultText{font-size:14px}.dialog-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.empty{grid-column:1/-1;text-align:center;padding:50px;background:#edf0e4;border-radius:16px}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);padding:12px 22px;background:#284d3c;color:white;border-radius:40px;display:none;z-index:5}@media(max-width:700px){header,main,footer{padding:18px}.hero{grid-template-columns:1fr;padding:25px 0;gap:22px}h1{font-size:49px}.hero-art{min-height:230px;border-radius:100px 100px 20px 20px}.bowl{font-size:110px}.sticker{right:10px}.picker{flex-wrap:wrap;padding:18px;gap:14px}.picker .field{min-width:40%}.picker button{width:100%}.grid{grid-template-columns:1fr}.food-art{height:190px}.section-head{gap:15px}footer{gap:20px}.small{max-width:140px;text-align:right}nav button{font-size:12px;padding:9px 13px}}
</style></head><body><header><div class="logo">makan<span>•</span></div><nav><button id="discover">发现美味</button><button id="favorites">♡ 我的收藏 <span id="count">0</span></button></nav></header><main><section class="hero"><div><div class="eyebrow">LESS THINKING. MORE MAKAN.</div><h1>今天吃什么？<br><em>让好心情决定。</em></h1><p>从一碗热腾腾的叻沙，到熟悉的椰浆饭。<br>给选择困难的你，一点好吃的灵感。</p><div class="small" style="text-align:left;max-width:none">✦ 马来西亚美食灵感 · 每一餐都值得期待</div></div><div class="hero-art" aria-label="一碗美食插画"><div class="sticker">跟着胃走<br>JUST MAKAN</div><div class="bowl">🍜</div><div class="art-label">YOUR NEXT HAPPY MEAL</div></div></section><section class="picker" aria-label="选择用餐偏好"><div class="field"><label for="budget">01 / 今天的预算</label><select id="budget"><option value="99">都可以，开心就好</option><option value="10">RM 10 以内</option><option value="15">RM 15 以内</option><option value="25">RM 25 以内</option></select></div><div class="field"><label for="taste">02 / 想吃什么口味</label><select id="taste"><option value="all">什么都想试试</option><option value="spicy">香辣过瘾 🌶️</option><option value="mild">清淡暖胃 🍃</option><option value="sweet">甜蜜快乐 🍯</option></select></div><button class="primary" id="random">帮我选一餐 ↗</button></section><div class="section-head"><h2 id="sectionTitle">美味灵感，随时开饭。</h2><span class="small" id="summary"></span></div><section class="grid" id="grid" aria-live="polite"></section></main><footer><span class="logo" style="font-size:20px">makan•</span><span>为每一个「随便」的人而做。<br>美食灵感 Demo · 价格仅供演示参考</span></footer><dialog id="result"><div class="eyebrow">TODAY'S LITTLE JOY</div><div id="resultEmoji"></div><h2 id="resultName"></h2><p id="resultText"></p><div class="dialog-actions"><button id="again">再选一次 ↻</button><button class="primary" id="saveResult">♡ 收藏这一餐</button><button id="close">就吃这个 ✓</button></div></dialog><div id="toast" role="status"></div><script>
const foods=[{id:1,name:'椰浆饭',en:'NASI LEMAK',emoji:'🍚',price:8,taste:'spicy',desc:'椰香米饭配参巴酱，熟悉又满足的马来西亚味道。',color:'#e9edda'},{id:2,name:'咖喱叻沙',en:'CURRY LAKSA',emoji:'🍜',price:12,taste:'spicy',desc:'浓郁椰奶汤底，一口香辣，把平凡的一天叫醒。',color:'#f5e2ce'},{id:3,name:'海南鸡饭',en:'CHICKEN RICE',emoji:'🍗',price:10,taste:'mild',desc:'嫩滑鸡肉和油香米饭，简单就是最好的安慰。',color:'#f0e9d7'},{id:4,name:'印度煎饼',en:'ROTI CANAI',emoji:'🫓',price:5,taste:'mild',desc:'外酥内软，蘸一口豆咖喱，慢慢享受这一餐。',color:'#e9dfce'},{id:5,name:'煎蕊',en:'CENDOL',emoji:'🍧',price:7,taste:'sweet',desc:'椰奶、椰糖与碎冰，给炎热午后一份清凉。',color:'#dfe9df'},{id:6,name:'沙爹拼盘',en:'SATAY',emoji:'🍢',price:18,taste:'spicy',desc:'炭烤肉串配浓香花生酱，适合想犒赏自己的你。',color:'#ecdccf'},{id:7,name:'云吞面',en:'WONTON MEE',emoji:'🥟',price:9,taste:'mild',desc:'弹牙细面和鲜香云吞，温柔填饱你的胃。',color:'#e8e9de'},{id:8,name:'咖椰吐司',en:'KAYA TOAST',emoji:'🍞',price:6,taste:'sweet',desc:'酥脆吐司夹咖椰酱，日常的小小幸福。',color:'#f1e1bc'},{id:9,name:'炒粿条',en:'CHAR KWAY TEOW',emoji:'🍝',price:11,taste:'spicy',desc:'大火快炒的镬气，让今天吃得有滋有味。',color:'#e9dfd4'}];
let saved=[];try{saved=JSON.parse(localStorage.getItem('makan-saved')||'[]');if(!Array.isArray(saved))saved=[]}catch{}let favoriteMode=false,current=null,last=null;const $=id=>document.getElementById(id);function filtered(){return foods.filter(f=>f.price<=Number($('budget').value)&&($('taste').value==='all'||f.taste===$('taste').value))}function persist(){try{localStorage.setItem('makan-saved',JSON.stringify(saved))}catch{toast('浏览器未允许保存，收藏在本次使用中有效')}render()}function toggle(id){saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];persist();if(current)$('saveResult').textContent=saved.includes(current.id)?'♥ 已收藏':'♡ 收藏这一餐'}function render(){const list=filtered().filter(f=>!favoriteMode||saved.includes(f.id));$('count').textContent=saved.length;$('sectionTitle').textContent=favoriteMode?'把喜欢的，留给下一餐。':'美味灵感，随时开饭。';$('summary').textContent=`${list.length} 道${favoriteMode?'收藏':'美食'} · 参考价格 RM`;$('grid').innerHTML=list.length?list.map(f=>`<article class="card"><div class="food-art" style="background:${f.color}"><span>${f.emoji}</span><button class="save" data-id="${f.id}" aria-label="${saved.includes(f.id)?'取消收藏':'收藏'}${f.name}" aria-pressed="${saved.includes(f.id)}">${saved.includes(f.id)?'♥':'♡'}</button></div><div class="card-body"><div class="tags">${f.en}</div><h3>${f.name}</h3><p>${f.desc}</p><div class="card-bottom"><span class="price">RM ${f.price.toFixed(2)}</span><span class="pill">${{spicy:'香辣过瘾',mild:'清淡暖胃',sweet:'甜蜜快乐'}[f.taste]}</span></div></div></article>`).join(''):'<div class="empty">这里还没有美食。<br><p>试试放宽筛选，或先收藏一道喜欢的吧。</p></div>'}function pick(){const list=filtered().filter(f=>f.id!==last);const pool=list.length?list:filtered();if(!pool.length){toast('这个组合还没有美食，试试其他预算或口味');return}current=pool[Math.floor(Math.random()*pool.length)];last=current.id;$('resultEmoji').textContent=current.emoji;$('resultName').textContent=current.name;$('resultText').textContent=`${current.desc} 参考价格 RM ${current.price.toFixed(2)}`;$('saveResult').textContent=saved.includes(current.id)?'♥ 已收藏':'♡ 收藏这一餐';if(!$('result').open)$('result').showModal()}let timer;function toast(msg){$('toast').textContent=msg;$('toast').style.display='block';clearTimeout(timer);timer=setTimeout(()=>$('toast').style.display='none',2800)}$('grid').onclick=e=>{const b=e.target.closest('[data-id]');if(b)toggle(Number(b.dataset.id))};$('budget').onchange=render;$('taste').onchange=render;$('random').onclick=pick;$('again').onclick=pick;$('saveResult').onclick=()=>toggle(current.id);$('close').onclick=()=>{$('result').close();toast('开饭啦！祝你有个好胃口 ✨')};$('favorites').onclick=()=>{favoriteMode=!favoriteMode;render();$('sectionTitle').scrollIntoView({block:'center'})};$('discover').onclick=()=>{favoriteMode=false;render();$('sectionTitle').scrollIntoView({block:'center'})};$('result').onclick=e=>{if(e.target===$('result')){const r=$('result').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('result').close()}};render();
</script></body></html>
